defaults: &reporting
  runtimes: [codex]
  model: low

automations:
  - <<: *reporting
    id: update
    display-name: "⬇️ UPDATE"
    group: REPORTS
    thread:
      name: UPDATES
    schedule:
      cron: "0 23 * * *"
    prompt:
      file: ../prompts/update.md
  - <<: *reporting
    id: smoke-test
    enabled: false
    schedule: every 15 minutes
    prompt:
      file: ../prompts/smoke-test.md
