steps:
  - id: dotfiles
    check:
      command: bun
      args: [scripts/setup.js, check, dotfiles]
    apply:
      command: bun
      args: [scripts/setup.js, apply, dotfiles]
  - id: codex-config
    runtimes: [codex]
    check:
      command: bun
      args: [scripts/setup.js, check, config]
    apply:
      command: bun
      args: [scripts/setup.js, apply, config]
  - id: piroplugin
    runtimes: [codex]
    check:
      command: bun
      args: [scripts/setup.js, check, plugin, me, piroplugin]
    apply:
      command: bun
      args: [scripts/setup.js, apply, plugin, me, piroplugin]
      timeout-seconds: 900
  - id: tanaab-plugin
    runtimes: [codex]
    check:
      command: bun
      args: [scripts/setup.js, check, plugin, canon, tanaab, optional]
    apply:
      command: bun
      args: [scripts/setup.js, apply, plugin, canon, tanaab, optional]
      timeout-seconds: 900
  - id: agent-system-plugin
    runtimes: [codex]
    check:
      command: bun
      args: [scripts/setup.js, check, plugin, openclaw-agent-system, agent-system, optional, build]
    apply:
      command: bun
      args: [scripts/setup.js, apply, plugin, openclaw-agent-system, agent-system, optional, build]
      timeout-seconds: 900
