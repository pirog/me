schema-version: 1
debug: true

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png
  email:
    from-environment: EMAIL

environment:
  op: zsstdfqknicwfv5glv76gd6tue

git:
  ssh:
    private-keys:
      - path: ~/.ssh/id_pirog

github:
  host: github.com
  username: pirog
  token: GH_TOKEN
  config:
    git-protocol: ssh
  schema-version: 3
  runtimes:
    - codex
  max-concurrent-items: 5
  routing:
    - pirog/me: "39703761-8791-4c82-8012-34d8f0c08c27"
    - tanaabased/openclaw-agent-system: "39703761-8791-4c82-8012-34d8f0c08c27"
    - tanaabased/tanaabot: "39703761-8791-4c82-8012-34d8f0c08c27"
    - "tanaabased/*": swarm
    - "pirog/*": swarm
    - "lando/*": swarm
  issue-pickup:
    projects:
      - repository: pirog/me
        limit: 1
        milestone: { number: 3, policy: only }
      - repository: tanaabased/openclaw-agent-system
        limit: 1
        milestone: { number: 16, policy: only }
      - repository: tanaabased/tanaabot
        limit: 1
        milestone: { number: 3, policy: only }
  issue-assignment:
    mode: auto
    allowed:
      - "@pirog"
      - "@tanaabot"
    reviewers:
      - "@emoriwan"
      - "@smutlord"
    assessment:
      skill: piroplugin:piro-issue-assessment
      guidance:
        file: guidance/assessment.md
    implementation:
      skill: piroplugin:piro-issue-implementation
    feedback:
      skill: piroplugin:piro-feedback-reply

models:
  default:
    model: openai/gpt-6.2-astra
    effort: high
  low:
    model: openai/gpt-6.2-sol
    effort: medium
  medium:
    model: openai/gpt-6.2-sol
    effort: high
  high:
    model: openai/gpt-6.2-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  file: ./automations.yml
