schema-version: 1

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png
github:
  host: github.com
  username: pirog
  notifications:
    schema-version: 2
    runtimes: [codex]
    interval-minutes: 5
    allowed-repository-owners:
      - login: tanaabased
        node-id: O_kgDODNGy1g
      - login: pirog
        node-id: MDQ6VXNlcjcxMzQyNA==
      - login: lando
        node-id: MDEyOk9yZ2FuaXphdGlvbjMxNjA1NTg0
    issue-assignment:
      mode: plan
      allowed:
        - login: pirog
          node-id: MDQ6VXNlcjcxMzQyNA==
models:
  default:
    model: openai/gpt-6-astra
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  - id: smoke-test
    enabled: false
    runtimes: [codex]
    schedule: every 15 minutes
    prompt: |
      Reply with "Pyro automation smoke test passed" and the current local time.
      Do not access project files or connected services. Apart from updating the automation memory
      supplied with the run, do not change state.
