schema-version: 1
debug: true

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png

git:
  ssh:
    private-keys:
      - path: ~/.ssh/id_pirog

github:
  host: github.com
  username: pirog
  config:
    git-protocol: ssh
  schema-version: 3
  runtimes:
    - codex
  max-concurrent-items: 5
  routing:
    - "tanaabased/*"
    - "pirog/*"
    - "lando/*"
  issue-pickup:
    projects:
      - repository: tanaabased/openclaw-agent-system
        milestone:
          number: 14
          policy: only
  issue-assignment:
    mode: auto
    allowed:
      - "@pirog"
      - "@tanaabot"
    reviewers:
      - "@emoriwan"
      - "@smutlord"
    assessment:
      skill: piroplugin:piro-issue-assessment
      guidance:
        file: .agent-system/guidance/assessment.md
    implementation:
      skill: piroplugin:piro-issue-implementation
    feedback:
      skill: piroplugin:piro-feedback-reply

models:
  default:
    model: openai/gpt-6-astra
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  - id: update
    display-name: "⬇️ UPDATE"
    enabled: true
    runtimes:
      - codex
    group: REPORTS
    thread:
      name: UPDATES
    model: low
    schedule:
      cron: "0 23 * * *"
    prompt: |
      Update this Codex installation using its trusted Me binding.
      Read references/updates.md in the bound workspace and follow that procedure:
      safely fast-forward eligible main checkouts while preserving local edits. Use Me’s setup helper
      to finish eligible dependency/build and Codex plugin/cache refreshes independently, then run
      the full Agent System Doctor → Install → Doctor against the trusted Me binding. Preserve
      safety holds without making every repository's refresh success a lifecycle prerequisite.
      Review/trust changed hooks through the native CLI when needed.
      Ordinary read-only ISSUE ASSIGNMENTS activity alone is not a source-update hold.
      Leave other schedules running. Report recoverable failures, unknowns and restart/context needs.
      Return one quoted status card after every run, including unchanged days, for morning review.
  - id: smoke-test
    enabled: false
    runtimes:
      - codex
    schedule: every 15 minutes
    prompt: |
      Reply with "Pyro automation smoke test passed" and the current local time.
      Do not access project files or connected services. Apart from updating the automation memory
      supplied with the run, do not change state.
