schema-version: 1
debug: true

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png
  email:
    from-environment: EMAIL

environment:
  op: zsstdfqknicwfv5glv76gd6tue

git:
  ssh:
    private-keys:
      - path: ~/.ssh/id_pirog

github:
  host: github.com
  username: pirog
  token: GH_TOKEN
  config:
    git-protocol: ssh
  schema-version: 3
  runtimes:
    - codex
  max-concurrent-items: 5
  routing:
    - "tanaabased/*"
    - "pirog/*"
    - "lando/*"
  issue-pickup:
    projects:
      - repository: tanaabased/openclaw-agent-system
        milestone:
          number: 14
          policy: only
  issue-assignment:
    mode: auto
    allowed:
      - "@pirog"
      - "@tanaabot"
    reviewers:
      - "@emoriwan"
      - "@smutlord"
    assessment:
      skill: piroplugin:piro-issue-assessment
      guidance:
        file: guidance/assessment.md
    implementation:
      skill: piroplugin:piro-issue-implementation
    feedback:
      skill: piroplugin:piro-feedback-reply

models:
  default:
    model: openai/gpt-6.2-astra
    effort: high
  low:
    model: openai/gpt-6.2-sol
    effort: medium
  medium:
    model: openai/gpt-6.2-sol
    effort: high
  high:
    model: openai/gpt-6.2-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  file: ./automations.yml
