schema-version: 1
debug: true

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png

github:
  host: github.com
  username: pirog
  schema-version: 3
  runtimes:
    - codex
  max-concurrent-items: 5
  allowed-repository-owners:
    - "@tanaabased"
    - "@pirog"
    - "@lando"
  issue-assignment:
    mode: auto
    allowed:
      - "@pirog"
      - "@tanaabot"
    reviewers:
      - "@emoriwan"
      - "@smutlord"
    assessment:
      skill: piroplugin:piro-issue-assessment
      guidance:
        file: .agent-system/guidance/assessment.md
    implementation:
      skill: piroplugin:piro-issue-implementation
    feedback:
      skill: piroplugin:piro-feedback-reply

models:
  default:
    model: openai/gpt-6-astra
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  - id: nightly-refresh
    display-name: "🌙 NIGHTLY REFRESH"
    group: AGENT SYSTEM
    enabled: false
    runtimes:
      - codex
    thread:
      name: NIGHTLY REFRESH
    schedule:
      cron: "0 2 * * *"
      timezone: America/New_York
    prompt: |
      Run the nightly refresh for this activated Codex installation bound to Me.
      Resolve the workspace and installation from the newest trusted Agent System context.
      Read references/nightly-refresh.md in that bound workspace and follow its pilot gates,
      source refresh, native lifecycle, hook review, recovery, and reporting instructions.
      This declaration does not establish that the activation gates have passed.
      Return one quoted status card every morning, including unchanged days.
  - id: smoke-test
    enabled: false
    runtimes:
      - codex
    schedule: every 15 minutes
    prompt: |
      Reply with "Pyro automation smoke test passed" and the current local time.
      Do not access project files or connected services. Apart from updating the automation memory
      supplied with the run, do not change state.
