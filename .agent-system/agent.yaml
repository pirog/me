schema-version: 1
debug: true

agent:
  id: pirog
  name: Mike Pirog
  avatar: assets/icon-large-circle.png

github:
  host: github.com
  username: pirog
  schema-version: 3
  runtimes:
    - codex
  max-concurrent-items: 5
  allowed-repository-owners:
    - "@tanaabased"
    - "@pirog"
    - "@lando"
  issue-assignment:
    mode: auto
    allowed:
      - "@pirog"
      - "@tanaabot"
    reviewers:
      - "@emoriwan"
      - "@smutlord"
    assessment:
      skill: piroplugin:piro-issue-assessment
      guidance:
        file: .agent-system/guidance/assessment.md
    implementation:
      skill: piroplugin:piro-issue-implementation
    feedback:
      skill: piroplugin:piro-feedback-reply

models:
  default:
    model: openai/gpt-6-astra
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high

setup-host:
  file: ./setup-host.yaml
setup-agent:
  file: ./setup-agent.yaml

automations:
  - id: nightly-refresh
    display-name: "🌙 NIGHTLY REFRESH"
    enabled: true
    runtimes:
      - codex
    thread:
      name: NIGHTLY REFRESH
    schedule:
      cron: "0 23 * * *"
      timezone: America/New_York
    prompt: |
      Perform the nightly refresh for this Codex installation using its trusted Me binding.
      Read references/nightly-refresh.md in the bound workspace and follow that procedure:
      fast-forward clean main checkouts, refresh dependencies and all three Codex plugins,
      run Agent System Doctor → Install → Doctor including automation reconciliation,
      and review/trust changed hooks through the native CLI when needed.
      Leave other schedules running. Report recoverable failures and restart/context needs.
      Return one quoted status card after every run, including unchanged days, for morning review.
  - id: smoke-test
    enabled: false
    runtimes:
      - codex
    schedule: every 15 minutes
    prompt: |
      Reply with "Pyro automation smoke test passed" and the current local time.
      Do not access project files or connected services. Apart from updating the automation memory
      supplied with the run, do not change state.
