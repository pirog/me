name: Example Tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example:
          - agentbox
          - codex
          - inputs
          - defaults
          - openclaw
          - payload
          - tanaab
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up OpenClaw
        id: openclaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          agent-system: github:tanaabased/openclaw-agent-system#codex-workflows
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: dev
          commands: |
            bun run build
            version-injector dist/boot.sh --style sh --version "${{ env.STAMPED_VERSION }}"
      - name: Create boot alias for Leia examples
        shell: bash
        run: ln -sf dist/boot.sh dist/boot
      - name: Put prepared scripts on PATH
        shell: bash
        run: echo "$PWD/dist" >> "$GITHUB_PATH"
      - name: Refresh Homebrew when needed
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Run Leia-backed example
        uses: tanaabased/actions/run-leia@v1
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.openclaw.outputs.agent-system-artifact-path }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_TOOLS_CODEX_HOME: ${{ runner.temp }}/codex-home
          NO_COLOR: '1'
          PIROME_PAYLOAD_DIR: ${{ github.workspace }}
          OPTOKEN: ${{ secrets.TANAAB_OP_TEST }}
        with:
          scenarios: examples/${{ matrix.example }}/README.md
          shell: bash
          stdin: 'true'
          retry: '0'
