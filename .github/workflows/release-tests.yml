name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Prepare release-shaped build
        uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            bun run build
            version-injector dist/boot.sh --style sh --version "${{ env.STAMPED_VERSION }}"
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
            bun run format:check

  plugin:
    name: npm package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Prepare npm release
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bash -euc "for dir in skills/*/assets; do if [ -L \"$dir\" ]; then rm \"$dir\"; mkdir \"$dir\"; cp assets/composer-icon.svg assets/icon-large.png \"$dir/\"; fi; done"
            bun run format:write
            bun run format:check
      - name: Pack plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Dry-run npm publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true
