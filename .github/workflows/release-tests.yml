name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate repository policy
        run: bun run codex:validate
      - name: Validate generic Codex plugin contract
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Prepare release-shaped build
        uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            bun run lint
            bun run build
            version-injector dist/boot.sh --style sh --version "${{ env.STAMPED_VERSION }}"
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
      - name: Verify prepared formatting
        run: bun run format:check
      - name: Validate prepared repository policy
        run: bun run codex:validate
      - name: Validate prepared generic Codex plugin contract
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Verify stamped release entrypoint
        shell: bash
        run: |
          boot_version="$(bash ./dist/boot.sh --version)"
          printf 'boot=%s\n' "$boot_version"
          test "$boot_version" = "${{ env.STAMPED_VERSION }}"
      - name: Verify stamped plugin manifest
        shell: bash
        run: |
          plugin_version="v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          printf 'plugin=%s\n' "$plugin_version"
          test "$plugin_version" = "${{ env.STAMPED_VERSION }}"
      - name: Verify published metadata
        shell: bash
        run: |
          test -s dist/llms.txt
          grep -F 'https://boot.pirog.me/llms.txt' dist/sitemap.xml
          grep -F 'Allow: /llms.txt' dist/robots.txt
      - name: Package release archive
        id: publish-plugin
        uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          dry-run: true
          archive-name: piroplugin-${{ env.STAMPED_VERSION }}.tar.gz
          dependency-policy: include-production
          release-tag: ${{ env.STAMPED_VERSION }}
      - name: Verify release archive contents
        env:
          RELEASE_ARCHIVE: ${{ steps.publish-plugin.outputs.archive-path }}
        run: |
          tar -tzf "${RELEASE_ARCHIVE}" | grep -F '.codex-plugin/plugin.json'
          tar -tzf "${RELEASE_ARCHIVE}" | grep -F 'dist/boot.sh'
          tar -tzf "${RELEASE_ARCHIVE}" | grep -F 'dist/llms.txt'
          if tar -tzf "${RELEASE_ARCHIVE}" | grep -E '(^|/)node_modules/(@lando/leia|@eslint/js|eslint|eslint-config-prettier|globals|mocha|prettier|shellcheck)/'; then
            echo 'release archive must not include dev dependencies' >&2
            exit 1
          fi
