name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Run unit tests
        run: bun run test
      - name: Validate repository policy
        run: bun run codex:validate
      - name: Validate generic Codex plugin contract
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Export sitemap metadata
        run: echo "SITEMAP_LASTMOD=${{ github.event.release.published_at }}" >> "${GITHUB_ENV}"
      - name: Publish repository
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            bun run build
            version-injector dist/boot.sh --style sh --version "${{ github.event.release.tag_name }}"
            version-injector .codex-plugin/plugin.json --style json --version "${{ github.event.release.tag_name }}"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
      - name: Verify prepared formatting
        run: bun run format:check
      - name: Validate prepared repository policy
        run: bun run codex:validate
      - name: Validate prepared generic Codex plugin contract
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Publish Codex plugin archive
        uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          archive-name: piroplugin-${{ github.event.release.tag_name }}.tar.gz
          dependency-policy: include-production
          github-token: ${{ github.token }}
          release-tag: ${{ github.event.release.tag_name }}
