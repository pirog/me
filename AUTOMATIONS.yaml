schema-version: 1
automations:
  - id: smoke-test
    name: 🧪 Pyro automation smoke test
    enabled: true
    schedule:
      frequency: minutely
      interval: 15
    prompt: |
      Reply with "Pyro automation smoke test passed" and the current local time.
      Do not access project files or connected services. Apart from updating the automation memory
      supplied with the run, do not change state.
